    <!-- ========================================

    ========================================= -->

      rel="preconnect"

      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"

    ========================================= -->

    <link

      type="image/x-icon"

    >


    <!-- ========================================
         Initial Application Theme
    ========================================= -->

    <script>
      const savedTheme =
        localStorage.getItem(
          'portfolio-theme'
        );

      if (savedTheme === 'dark') {
        document.documentElement.setAttribute(
          'data-theme',
          'dark'
        );

        document.documentElement.setAttribute(
          'data-bs-theme',
          'dark'
        );
      }
    </script>


    <!-- ========================================
         Initial Application Loading
    ========================================= -->

    <style>
      html,
      body {
        min-height: 100%;

        margin: 0;
      }

      body {
        background-color: #dadae2;
      }

      [data-theme="dark"] body {
        background-color: #333333;
      }


      /* ========================================
         Application Loading
      ======================================== */

      .app-loading {
        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;

        background-color: #dadae2;
      }

      [data-theme="dark"]
      .app-loading {
        background-color: #333333;
      }


      /* ========================================
         Loading Dots
      ======================================== */

      .loading-dots {
        display: inline-flex;
        justify-content: center;
        align-items: center;

        gap: .4rem;
      }

      .loading-dot {
        width: .5rem;
        height: .5rem;

        border-radius: 50%;

        opacity: .45;

        transform:
          translateY(0);

        animation:
          loading-dot-animation
          1.2s
          ease-in-out
          infinite;
      }


      /* ========================================
         Loading Dot Colors
      ======================================== */

      .loading-dot-green {
        background-color: #c2fdcf;

        animation-delay: 0s;
      }

      .loading-dot-blue {
        background-color: #70d3fb;

        animation-delay: .15s;
      }

      .loading-dot-lime {
        background-color: #bef454;

        animation-delay: .3s;
      }

      [data-theme="dark"]
      .loading-dot-green {
        background-color: #9be7b0;
      }

      [data-theme="dark"]
      .loading-dot-blue {
        background-color: #69c9f3;
      }

      [data-theme="dark"]
      .loading-dot-lime {
        background-color: #b5e85a;
      }


      /* ========================================
         Loading Animation
      ======================================== */

      @keyframes loading-dot-animation {
        0%,
        60%,
        100% {
          opacity: .45;

          transform:
            translateY(0)
            scale(.95);
        }

        30% {
          opacity: 1;

          transform:
            translateY(-.2rem)
            scale(1.08);
        }
      }


      /* ========================================
         Screen Reader Text
      ======================================== */

      .app-loading
      .visually-hidden {
        position: absolute;

        width: 1px;
        height: 1px;

        padding: 0;
        margin: -1px;

        overflow: hidden;

        clip: rect(0, 0, 0, 0);

        white-space: nowrap;

        border: 0;
      }


      /* ========================================
         Reduced Motion
      ======================================== */

      @media (prefers-reduced-motion: reduce) {
        .loading-dot {
          opacity: .75;

          animation: none;
        }
      }
    </style>

  </head>


  <body>
    <div id="app">

      <!-- Initial Application Loading -->
      <div
        id="app-loading"
        class="app-loading"
        role="status"
        aria-live="polite"
      >
        <div class="loading-dots">

          <span
            class="loading-dot loading-dot-green"
          ></span>

          <span
            class="loading-dot loading-dot-blue"
          ></span>

          <span
            class="loading-dot loading-dot-lime"
          ></span>

          <span class="visually-hidden">
            Loading
          </span>

        </div>
      </div>

    </div>


    <!-- ========================================
         Vue / Vite Entry
    ========================================= -->

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
